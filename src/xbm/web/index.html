<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>X 书签库</title>
    <link rel="icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <aside>
      <a class="brand" href="#bookmarks"
        ><img src="/icon.svg" alt="" /><span
          >书签库<small>X BOOKMARK SYNC</small></span
        ></a
      >
      <div class="account-picker">
        <label for="account">登录的 X 账户</label
        ><select id="account" aria-label="登录的 X 账户">
          <option value="">未归属（旧版本数据）</option>
        </select>
      </div>
      <div class="nav-label">我的收藏</div>
      <nav aria-label="主要导航">
        <a href="#bookmarks" data-view="bookmarks">▤ <span>全部书签</span></a
        ><a href="#runs" data-view="runs">↻ <span>同步记录</span></a
        ><a href="#downloads" data-view="downloads">↓ <span>下载队列</span></a>
      </nav>
      <div class="aside-note">
        <span id="connection" class="dot">正在连接</span>
        <p>收藏在 X，留存在这里。</p>
        <small>个人 NAS · 本地存储</small>
      </div>
    </aside>
    <main>
      <header>
        <div>
          <p class="eyebrow">YOUR PERSONAL ARCHIVE</p>
          <h1 id="title">全部书签</h1>
          <p id="subtitle">值得保存的内容，随时回看。</p>
        </div>
        <button id="ownership-open" class="outline">旧数据归属</button
        ><button id="refresh" class="outline">↻ 刷新</button>
      </header>
      <div id="notice" role="status" hidden></div>
      <section class="stats" aria-label="服务概览">
        <div>
          <span>已保存书签</span><strong id="count-tweets">—</strong
          ><small>NAS 已确认入库</small>
        </div>
        <div>
          <span>媒体已下载</span><strong id="count-done">—</strong
          ><small id="completion">等待状态</small>
        </div>
        <div>
          <span>正在下载 / 等待</span><strong id="count-pending">—</strong
          ><small>后台自动处理</small>
        </div>
        <div>
          <span>下载失败</span><strong id="count-failed">—</strong
          ><small>可查看原因并重试</small>
        </div>
      </section>
      <section class="workspace">
        <div class="tools">
          <form id="search-form">
            <label class="sr-only" for="search">搜索书签</label
            ><input
              id="search"
              type="search"
              placeholder="搜索正文、作者或用户名…"
              maxlength="300"
            /><button type="submit">搜索</button>
          </form>
          <label for="filter" class="sr-only">筛选</label
          ><select id="filter">
            <option value="">全部类型</option></select
          ><span id="total"></span>
        </div>
        <div id="library-tools" class="tools">
          <select id="download-filter" aria-label="书签下载状态"><option value="">全部下载状态</option><option value="done">媒体全部已下载</option><option value="incomplete">媒体未完成</option><option value="failed">含失败媒体</option><option value="downloading">正在下载</option><option value="pending">等待下载</option></select>
          <select id="layout" aria-label="展示形式"><option value="cards">卡片</option><option value="list">紧凑列表</option><option value="preview">媒体预览</option></select>
          <select id="trash" aria-label="书签范围"><option value="0">书签库</option><option value="1">回收站</option></select>
          <button id="select-page" class="outline">选择本页</button><button id="delete-selected" class="outline" disabled>删除所选</button>
          <span id="selection-count"></span>
        </div>
        <p id="view-note" class="view-note"></p>
        <div id="content" aria-live="polite"></div>
        <footer class="pagination">
          <button id="prev" class="outline">← 上一页</button
          ><span id="page"></span
          ><button id="next" class="outline">下一页 →</button>
        </footer>
      </section>
      <footer class="main-footer">
        X BOOKMARK SYNC
        <span>媒体保存在你的 NAS · 页面每 3 秒更新任务状态</span>
      </footer>
    </main>
    <dialog id="detail">
      <div class="dialog-heading">
        <h2>书签详情</h2>
        <button id="close-detail" class="outline" aria-label="关闭详情">
          ✕
        </button>
      </div>
      <div id="detail-body"></div>
    </dialog>
    <dialog id="ownership">
      <div class="dialog-heading">
        <h2>旧数据归属</h2>
        <button id="ownership-close" class="outline" aria-label="关闭归属管理">
          ✕
        </button>
      </div>
      <p class="view-note">
        将未归属的书签、同步记录和下载文件合并到选定账户。原文件保留，执行前自动备份；不会自动猜测旧数据属于谁。
      </p>
      <label for="ownership-target">目标 X 账户</label>
      <select id="ownership-target" aria-label="目标 X 账户"></select>
      <div class="ownership-actions">
        <button id="ownership-read" class="outline">读取插件识别的账户</button
        ><button id="ownership-preview">预览归属</button>
      </div>
      <p id="ownership-account-note" class="view-note"></p>
      <div id="ownership-plan" role="status"></div>
      <button id="ownership-confirm" hidden>确认归属</button>
      <h3>归属任务记录</h3>
      <div id="ownership-history" aria-live="polite"></div>
    </dialog>
  </body>
</html>

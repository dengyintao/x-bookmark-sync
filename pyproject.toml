[project]
name = "xbm"
version = "0.5.2"
description = "Sync X (Twitter) bookmarks media to local NAS storage"
requires-python = ">=3.11"
dependencies = [
    "twifork==2.4.0",          # PINNED: X breaks scrapers every few weeks; upgrade only after smoke test
    "gallery-dl>=1.26",
    "httpx>=0.27",             # 下载器：流式下载 + 代理 + Range 断点续传
]
# NOTE: twifork is imported as `twikit` (drop-in replacement of d60/twikit)

[project.scripts]
xbm = "xbm.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xbm = ["web/*"]

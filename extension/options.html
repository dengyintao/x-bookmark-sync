<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><style>
body{padding:24px;font-family:system-ui,sans-serif;font-size:14px;max-width:520px}
label{display:block;margin:12px 0 4px;color:#555}
input{width:100%;padding:8px;border:1px solid #ccc;border-radius:6px;font-size:14px}
button{margin-top:16px;padding:8px 20px;border:1px solid #ccc;border-radius:6px;background:#1d9bf0;color:#fff;cursor:pointer;font-size:14px}
button.ghost{background:#fff;color:#333;margin-left:8px}
#msg{margin-top:12px;color:#666}
</style></head>
<body>
<h2>连接你的 NAS</h2>
<p>① 在 NAS 管理页登录并打开“连接与配对”，生成一次性配对码。<br>② 填写地址和配对码，连接成功后打开 X 书签页。<br>③ 在扩展弹窗开始自动采集，无需手动下拉。</p>
<p>使用可信局域网或 HTTPS 地址。配对凭据只保存在当前浏览器，不通过 Chrome 账户同步。</p>
<label>服务端地址（NAS 上 xbm serve 的地址）</label>
<input id="serverUrl" placeholder="http://192.168.1.10:8765">
<label for="pairCode">一次性配对码（5 分钟有效）</label>
<input id="pairCode" type="password" autocomplete="off" placeholder="从 NAS 管理页复制，不要填管理员密钥">
<label for="clientName">此浏览器的名称</label><input id="clientName" maxlength="80" value="我的 Chrome">
<button id="pair">配对 NAS</button>
<label>自动采集间隔（分钟）</label>
<input id="intervalMinutes" type="number" min="15" value="60">
<div>
<button id="save">保存</button>
<button id="test" class="ghost">测试连接</button>
</div>
<div id="msg"></div>
<h3>最近任务记录</h3><button id="refreshHistory" class="ghost">刷新记录</button><div id="history"></div>
<script src="connection.js"></script>
<script src="options.js"></script>
</body></html>

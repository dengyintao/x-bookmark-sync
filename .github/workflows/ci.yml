name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Import check
        run: python -c "import xbm.cli, xbm.server, xbm.db, xbm.config, xbm.migration"
      - name: Server tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Extension checks and behavior tests
        run: |
          for f in extension/*.js; do node --check "$f"; done
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8'))"
          node --test tests/*.test.cjs

  build:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install wheel build tools
        run: python -m pip install "setuptools>=61" wheel "pyinstaller==6.16.0" "imageio-ffmpeg==0.6.0" .
      - name: Install official fnpack 1.2.3
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64 \
            --output "${RUNNER_TEMP}/fnpack"
          echo "54b97fa7b70968c4d05c79840f5daeff508957d0bb2062fdb0376d00d9615c93  ${RUNNER_TEMP}/fnpack" | sha256sum --check
          chmod 755 "${RUNNER_TEMP}/fnpack"
      - name: Build FPK, wheel, extension and committed sources
        env:
          FNPACK_BIN: ${{ runner.temp }}/fnpack
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: python scripts/build_release.py
      - name: Verify release checksums
        working-directory: dist/release
        run: sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: xbm-release-assets
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xbm-release-assets
          path: dist/release
      - name: Verify downloaded assets
        working-directory: dist/release
        run: sha256sum --check SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          name: X Bookmark Sync ${{ github.ref_name }}
          files: dist/release/*
          body_path: packaging/RELEASE_NOTES.md
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
